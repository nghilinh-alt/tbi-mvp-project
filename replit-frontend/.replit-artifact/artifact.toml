kind = "web"
previewPath = "/"
title = "TBI Employment Pathways"
version = "1.0.0"
id = "artifacts/tbi-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20595

[services.development]
run = "pnpm --filter @workspace/tbi-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tbi-app", "run", "build" ]
publicDir = "artifacts/tbi-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20595"
BASE_PATH = "/"
